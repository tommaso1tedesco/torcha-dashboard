# =====================================================================
# sources.yaml — configurazione fonti della dashboard editoriale
# =====================================================================
# ISTRUZIONI PER CHI COMPILA:
# - I campi `rss_url` sono da VERIFICARE dal vivo alla build. NON inventarli.
#   Se una testata non ha un RSS pubblico funzionante, impostare `via: apify`.
# - `via: rss`    -> raccolta tramite feed RSS (gratis, stabile).
# - `via: apify`  -> raccolta tramite Actor Apify (proxy/anti-bot gestiti da Apify).
# - `paywall: true` -> il feed dà solo titolo + abstract (niente testo completo):
#   va benissimo come SEGNALE di cosa è caldo, non per ripubblicare.
# - Una fonte può comparire in più categorie con la sua sezione dedicata (es. ANSA).
# =====================================================================

settings:
  geo: IT
  lang: it
  # frequenza del worker cron (minuti): governa solo l'ingest RSS/Wikipedia/Autocomplete
  # (gratuiti). Le fonti Apify a pagamento hanno il proprio limite indipendente
  # (APIFY_MIN_INTERVAL_HOURS in src/ingest_interests.py, 12h) e non seguono questo valore.
  refresh_minutes: 30

