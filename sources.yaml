# =====================================================================
# PARTE 2 — COSA CERCANO LE PERSONE (domanda di ricerca / interesse)
# =====================================================================
# NOTA: niente LLM. Le query fatte a ChatGPT/Gemini/ecc. sono private e
# non esistono come dato pubblico: non c'è nulla da raccogliere lì.
interests:

  apify:
    token_env: "APIFY_TOKEN"        # il token sta in variabile d'ambiente
    actors:
      # Confermare gli actor_id esatti sullo Store Apify e lo schema di input.
      google_trends:
        actor_id: ""                # es. trending searches + interest over time
        input: { geo: "IT" }
      google_serp:
        actor_id: ""                # organico + People Also Ask + ricerche correlate
        input: { country: "it", language: "it" }
      tiktok_trending:
        actor_id: ""
      youtube_trending:
        actor_id: ""
        input: { geo: "IT" }
      x_trending:
        actor_id: ""
      reddit_rising:
        actor_id: ""
        input: { subreddits: ["italy", "news", "worldnews"] }

  wikipedia:
    project: "it.wikipedia"
    method: "pageviews_api"         # API REST ufficiale, gratuita
    signals: ["top_daily", "per_article_trend"]

  google_autocomplete:
    enabled: true
    # endpoint suggest pubblico; le keyword seed arrivano dai temi caldi delle notizie
