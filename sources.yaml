# =====================================================================
# sources.yaml — configurazione fonti della dashboard editoriale
# =====================================================================
# ISTRUZIONI PER CHI COMPILA:
# - I campi `rss_url` sono da VERIFICARE dal vivo alla build. NON inventarli.
#   Se una testata non ha un RSS pubblico funzionante, NON va inserita: l'ingest
#   gestisce solo `via: rss` (nessuna integrazione a pagamento).
# - `via: rss`    -> raccolta tramite feed RSS (gratis, stabile).
# - `paywall: true` -> il feed dà solo titolo + abstract (niente testo completo):
#   va benissimo come SEGNALE di cosa è caldo, non per ripubblicare.
# - Una fonte può comparire in più categorie con la sua sezione dedicata (es. ANSA).
# =====================================================================

settings:
  geo: IT
  lang: it
  # frequenza del worker cron (minuti): governa l'ingest RSS
  # (gratuiti).
  refresh_minutes: 30

# =====================================================================
# NOTIZIE CALDE, DIVISE PER CATEGORIA
# =====================================================================
categories:

  attualita:
    label: "Attualità"
    sources:
      - name: "ANSA"
        homepage: "https://www.ansa.it"
        via: rss
        rss_url: "https://www.ansa.it/sito/ansait_rss.xml"        # verificato 200 OK, <rss>
      - name: "Sky TG24"
        homepage: "https://tg24.sky.it"
        via: rss
        rss_url: "https://tg24.sky.it/rss/tg24.xml"                # verificato 200 OK, <rss>
      - name: "Rai News"
        homepage: "https://www.rainews.it"
        via: rss
        rss_url: "https://www.rainews.it/rss/tutti"                # verificato 200 OK, <rss>
      - name: "Adnkronos"
        homepage: "https://www.adnkronos.com"
        via: rss
        rss_url: "https://www.adnkronos.com/RSS_PrimaPagina.xml"   # verificato 200 OK, <rss> (feed "Prima Pagina")
      - name: "Open"
        homepage: "https://www.open.online"
        via: rss
        rss_url: "https://www.open.online/feed/"                   # verificato 200 OK, <rss>

  ultima_ora:
    label: "Ultima ora"
    # NON sono fonti nuove: è la vista "più recenti per orario" sulle generaliste.
    # Usare i feed "Ultima Ora" dedicati dove esistono, o il feed generale se molto
    # frequente (Sky TG24, Rai News); ordinare per timestamp. Include anche un paio
    # di fonti internazionali per il breaking news globale (in inglese).
    view_only: true
    sources:
      - name: "ANSA — Ultima Ora"
        homepage: "https://www.ansa.it/sito/notizie/topnews/ultimaora.html"
        via: rss
        rss_url: "https://www.ansa.it/sito/notizie/topnews/topnews_rss.xml"  # verificato 200 OK, <rss>
