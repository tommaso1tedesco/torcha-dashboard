        homepage: "https://www.adnkronos.com"
        via: rss
        rss_url: "https://www.adnkronos.com/RSS_Ultimora.xml"      # verificato 200 OK, <rss>
      - name: "Sky TG24"
        homepage: "https://tg24.sky.it"
        via: rss
        rss_url: "https://tg24.sky.it/rss/tg24.xml"                # verificato 200 OK, flusso continuo (ultimo item alle 10:33 del giorno della verifica)
      - name: "Rai News"
        homepage: "https://www.rainews.it"
        via: rss
        rss_url: "https://www.rainews.it/rss/tutti"                # verificato 200 OK, aggiornamento continuo (ultimo item alle 09:12)
      - name: "BBC News"
        homepage: "https://www.bbc.com/news"
        via: rss
        rss_url: "http://feeds.bbci.co.uk/news/rss.xml"             # verificato 200 OK, <rss> (ultimo item 06:58)
        lang: en
      - name: "The Guardian"
        homepage: "https://www.theguardian.com/world"
